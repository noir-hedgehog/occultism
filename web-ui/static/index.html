<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>玄学大典 Agent 工作台</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <aside class="sidebar" aria-label="项目概览">
          <div class="brand">
            <span class="mark">玄</span>
            <div>
              <h1>玄学大典</h1>
              <p>Agent 工作台</p>
            </div>
          </div>
          <div class="metric-grid" id="metrics"></div>
          <nav class="doc-list" id="docs" aria-label="知识库入口"></nav>
        </aside>

        <section class="main-panel">
          <div class="request-bar">
            <label for="requestText">请求</label>
            <textarea id="requestText" rows="4">帮我做一个塔罗三张牌，看看工作状态</textarea>
            <div class="controls">
              <select id="domainSelect" aria-label="指定流派">
                <option value="">自动识别流派</option>
                        <option value="tarot">塔罗</option>
                        <option value="fengshui">风水</option>
                <option value="yijing">易经</option>
                <option value="ritual">空间净化/驱邪</option>
                <option value="dream">解梦</option>
                <option value="lost_object">失物寻物</option>
              </select>
              <button id="runButton" type="button">运行路由</button>
            </div>
          </div>

          <section class="status-strip" id="statusStrip"></section>

          <div class="content-grid">
            <section class="panel">
              <div class="panel-heading">
                <h2>主干</h2>
                <span id="trunkCount"></span>
              </div>
              <div class="trunks" id="trunks"></div>
            </section>

            <section class="panel">
              <div class="panel-heading">
                <h2>执行流程</h2>
                <span id="routeBadge">待运行</span>
              </div>
              <div id="workflow" class="workflow"></div>
            </section>

            <section class="panel">
              <div class="panel-heading">
                <h2>范式</h2>
                <span id="paradigmBadge"></span>
              </div>
              <div id="paradigmPanel" class="paradigm"></div>
            </section>

            <section class="panel">
              <div class="panel-heading">
                <h2>工作单</h2>
                <span id="packetBadge"></span>
              </div>
              <div id="packetPanel" class="packet"></div>
            </section>

            <section class="panel panel-wide">
              <div class="panel-heading">
                <h2>证据矩阵</h2>
                <span id="evidenceBadge"></span>
              </div>
              <div id="evidencePanel" class="evidence-panel"></div>
            </section>

            <section class="panel">
              <div class="panel-heading">
                <h2>上下文</h2>
                <span id="contextBadge"></span>
              </div>
              <div id="contextDocs" class="context-docs"></div>
            </section>

            <section class="panel">
              <div class="panel-heading">
                <h2>工具链</h2>
                <span id="toolBadge"></span>
              </div>
              <div id="toolCommands" class="commands"></div>
            </section>

            <section class="panel panel-wide">
              <div class="panel-heading">
                <h2>安全执行</h2>
                <span id="executionBadge">待运行</span>
              </div>
              <div class="execution-tools">
                <button id="executionButton" type="button">运行安全子集</button>
                <div id="executionPanel" class="execution-panel"></div>
                <pre id="executionOutput" class="preview-output">{}</pre>
              </div>
            </section>

            <section class="panel panel-wide">
              <div class="panel-heading">
                <h2>结构化输入</h2>
                <span id="previewBadge">待生成</span>
              </div>
              <div class="structured-tools">
                <div class="structured-form">
                  <div class="field-row">
                    <label for="previewMode">类型</label>
                    <select id="previewMode">
                      <option value="tarot">塔罗</option>
                      <option value="fengshui">风水</option>
                    </select>
                  </div>
                  <div id="tarotFields" class="mode-fields">
                    <div class="field-row">
                      <label for="tarotQuestion">问题</label>
                      <textarea id="tarotQuestion" rows="2">最近工作很烦，想做三张牌看看状态</textarea>
                    </div>
                    <div class="field-row">
                      <label for="tarotSpread">牌阵</label>
                      <select id="tarotSpread">
                        <option value="three_card_situation">三张状态牌阵</option>
                        <option value="past_present_tendency">过去-现在-趋势</option>
                      </select>
                    </div>
                    <div class="card-inputs">
                      <input id="tarotCard1" value="魔术师" aria-label="第一张牌" />
                      <select id="tarotOrientation1" aria-label="第一张方向">
                        <option value="upright">正位</option>
                        <option value="reversed">逆位</option>
                      </select>
                      <input id="tarotCard2" value="宝剑八" aria-label="第二张牌" />
                      <select id="tarotOrientation2" aria-label="第二张方向">
                        <option value="upright">正位</option>
                        <option value="reversed">逆位</option>
                      </select>
                      <input id="tarotCard3" value="星币三" aria-label="第三张牌" />
                      <select id="tarotOrientation3" aria-label="第三张方向">
                        <option value="upright">正位</option>
                        <option value="reversed">逆位</option>
                      </select>
                    </div>
                  </div>
                  <div id="fengshuiFields" class="mode-fields" hidden>
                    <div class="field-row">
                      <label for="fengshuiSpaceType">空间</label>
                      <select id="fengshuiSpaceType">
                        <option value="bedroom">卧室</option>
                        <option value="office">书房/办公室</option>
                        <option value="living_room">客厅</option>
                        <option value="kitchen">厨房</option>
                        <option value="entrance">玄关/入口</option>
                        <option value="shop">店铺</option>
                      </select>
                    </div>
                    <div class="field-row">
                      <label for="fengshuiDescription">描述</label>
                      <textarea id="fengshuiDescription" rows="3">卧室床尾正对门，镜子在床侧，晚上容易被通知灯打扰，最近睡不好</textarea>
                    </div>
                    <div class="field-row">
                      <label for="fengshuiConcerns">困扰</label>
                      <input id="fengshuiConcerns" value="sleep, pressure" />
                    </div>
                  </div>
                  <button id="previewButton" type="button">生成预览</button>
                </div>
                <pre id="previewOutput" class="preview-output">{}</pre>
              </div>
            </section>

            <section class="panel panel-wide">
              <div class="panel-heading">
                <h2>Agent 交接</h2>
                <span id="handoffBadge">待生成</span>
              </div>
              <div class="handoff-tools">
                <div class="field-row">
                  <label for="draftOutput">草稿</label>
                  <textarea id="draftOutput" rows="4">这次牌面更适合当作工作状态的反思：先把事实、猜测和下一步拆开，再选一个 24 小时内能推进的小动作；它不保证结果，也不替代现实沟通。</textarea>
                </div>
                <button id="handoffButton" type="button">生成交接包</button>
                <pre id="handoffOutput" class="preview-output">{}</pre>
              </div>
            </section>

            <section class="panel panel-wide">
              <div class="panel-heading">
                <h2>案例记录</h2>
                <span id="caseBadge">待生成</span>
              </div>
              <div class="case-tools">
                <div class="field-row">
                  <label for="caseSourceLabel">来源标签</label>
                  <input id="caseSourceLabel" value="web-ui-candidate" />
                </div>
                <div class="field-row">
                  <label for="caseFollowUp">回访</label>
                  <textarea id="caseFollowUp" rows="3">两天后复盘：我把事实和猜测拆开后，确实更容易推进沟通。</textarea>
                </div>
                <div class="case-grid">
                  <div class="field-row">
                    <label for="caseValidation">验证结果</label>
                    <select id="caseValidation">
                      <option value="unverified">未验证</option>
                      <option value="supports_practical_use">支持实用价值</option>
                      <option value="mixed">部分支持/混合</option>
                      <option value="no_support">未支持</option>
                      <option value="safety_only">仅保留安全价值</option>
                    </select>
                  </div>
                  <div class="field-row">
                    <label for="caseReviewer">审校人</label>
                    <input id="caseReviewer" value="internal-reviewer" />
                  </div>
                  <label class="check-row" for="caseApproved">
                    <input id="caseApproved" type="checkbox" />
                    <span>审校通过</span>
                  </label>
                </div>
                <button id="caseButton" type="button">生成案例候选</button>
                <pre id="caseOutput" class="preview-output">{}</pre>
              </div>
            </section>

            <section class="panel panel-wide">
              <div class="panel-heading">
                <h2>文档站</h2>
                <span id="docBadge"></span>
              </div>
              <div class="doc-browser">
                <div id="docIndex" class="doc-index"></div>
                <pre id="docContent" class="doc-content">选择一篇文档</pre>
              </div>
            </section>
          </div>

          <section class="json-panel">
            <div class="panel-heading">
              <h2>JSON</h2>
              <button id="toggleJson" type="button">展开</button>
            </div>
            <pre id="jsonOutput" hidden>{}</pre>
          </section>
        </section>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
